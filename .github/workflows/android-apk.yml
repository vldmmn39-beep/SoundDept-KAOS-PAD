name: Build KAOS PAD APK
on:
  push:
    branches: [main]
    paths:
      - 'SoundDept_KAOS_PAD_v08_GitHub_Source.zip'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          test -s SoundDept_KAOS_PAD_v08_GitHub_Source.zip
          unzip -o SoundDept_KAOS_PAD_v08_GitHub_Source.zip -d .
          test -s app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/sounddept/kaospad/MainActivity.java")
          s = p.read_text()
          old = "if(opened!=null)opened.close();"
          assert old in s, "expected MIDI close statement not found"
          p.write_text(s.replace(old,"if(opened!=null)try{opened.close();}catch(Exception ignored){}"))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -8
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: SoundDept-KAOS-PAD-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
